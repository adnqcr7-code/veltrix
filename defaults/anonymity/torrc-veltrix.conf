# VELTRIX Anonymity — Tor drop-in for Tor mode.
#
# Installed by veltrix-anonymity to /etc/tor/torrc.d/veltrix-anonymity.conf
# (from /usr/share/veltrix/anonymity/torrc-veltrix.conf) when Tor mode is
# turned on, and removed again when it is turned off. The main torrc is
# never edited: this file is the whole Tor side of the module, so `off`
# leaves Tor exactly as it found it (and a Tor the user was already
# running keeps running, just without these three ports).
#
#   TransPort 9040 — the transparent proxy: the nftables ruleset
#     redirects all TCP here, so applications need no proxy settings
#     and cannot bypass Tor by ignoring one.
#   DNSPort 5353 — Tor resolves DNS itself, over its own circuits; the
#     ruleset redirects every UDP/53 packet here, so there is no
#     plaintext-DNS path while Tor mode is on.
#   SocksPort 9050 — Tor's default SOCKS port, kept for the leak-check
#     (and for any app that prefers an explicit SOCKS proxy). Listening
#     on loopback only, as always.
#
# What is deliberately NOT here: no ExitPolicy (this machine is a Tor
# client, never an exit relay), no bridge lines (bridges are a later
# step, for networks that block Tor outright), no logging to disk
# (Tor's logs would record circuit activity; the daemon's default
# logging stays as the distribution ships it).
TransPort 9040
DNSPort 5353
SocksPort 9050
