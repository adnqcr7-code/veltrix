<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Per-language Arabic face selection (Veltrix).

  Inter — the UI font — has no Arabic glyphs, so Arabic text falls back to
  whatever fontconfig picks first among the installed faces. On a stock
  install that is DejaVu Sans (verified 2026-11-12: `fc-match :lang=ar`
  returns DejaVu Sans), which does shape Arabic but is a Latin-first face
  with no Quranic glyphs and the wrong voice for this desktop. These rules
  prepend the correct Noto faces based on the language of the text being
  rendered, the same way the CJK file in this directory does for ja/zh/ko:
  Noto Sans Arabic for UI (sans-serif) and Noto Naskh Arabic for Quranic and
  serif text. Pango derives that language from the locale (LANG, i.e.
  Settings → Region), so each user gets their faces with no extra setup.
  Per-user fontconfig (~/.config/fontconfig, loaded at priority 50) still
  outranks this file.

  The prepends are binding="strong", deliberately: a weak prepend LOSES.
  Verified 2026-11-12 on the build VM — with a weak prepend the rule fires
  (FC_DEBUG shows the edit) but `fc-match sans-serif:lang=ar` still returns
  DejaVu Sans, because DejaVu covers Arabic and strongly matches the generic
  family, which outranks a weak first-family match. (The serif rule happened
  to win weak, but strong is correct there too, and consistent.) The
  justification is that empirical weak-loses finding alone: the CJK file in
  this directory does NOT use strong binding — it has zero `binding`
  attributes and prepends weak throughout (corrected 2026-11-12; the v1
  report's claim that it "already uses strong for its zh-cn/zh-tw/zh-hk
  rules" was false). Do not re-cite the CJK file as the precedent for strong.

  THE FILENAME IS LOAD-BEARING, same as the CJK file's: generic-family edits
  insert immediately before "sans-serif", so whichever config file runs
  FIRST lands earlier in the family list — and earlier position wins among
  fallback families. This file must therefore sort BEFORE fontconfig's own
  65-nonlatin.conf in /etc/fonts/conf.d: hence the "65-0-" prefix (Fedora's
  convention for the same fix).

  Latin text is untouched: the UI font (Inter) stays first in every pattern —
  these families only serve the glyphs the primary font doesn't have. No
  monospace rule: Arabic has no monospace tradition and no Noto Sans Mono
  Arabic face exists; Arabic in a monospace context falls back through the
  sans-serif chain above.

  Why Naskh for serif: Noto Naskh Arabic is the verified Quranic face —
  docs/bismillah-test.png (1600x260, 2026-11-12): Noto Naskh Arabic Regular
  at 96 px, PIL + raqm/HarfBuzz, reproduced pixel-identically on the build
  VM. Amiri is NOT named here: no render proof exists that it is better than
  Naskh, and no Arch package carries it (see the PKGBUILD font block).

  Shared file: shipped by the veltrix pacman package (PKGBUILD) AND by dev
  installs (install.sh §5) as /usr/share/fontconfig/conf.avail/… + a symlink in
  /etc/fonts/conf.d/ — keep ONE source here.
-->
<fontconfig>

  <!-- Arabic: UI text -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <!-- Arabic: Quranic and serif text -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>

</fontconfig>
