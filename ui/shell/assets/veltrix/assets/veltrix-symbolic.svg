<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 472" role="img" aria-label="VELTRIX logo">
<title>VELTRIX</title>
<!--
  VELTRIX brand mark (Adnan's logo, 2026-11-14): the stylised V — dark navy
  left half, bright-blue right half (vertical gradient), white slit with a
  small circle at the centre. The V mark only (no wordmark): the bar launcher,
  About header, installer welcome page and alert dialogs all show the mark
  alone, with the name beside/below it in text.
  NOTE: unlike the old crescent, this mark is TWO fixed colours, not
  currentColor — the logo is two-tone by design, so GTK symbolic recolour
  does not apply. On a dark bar the navy half is low-contrast by design;
  the blue half carries the shape. Do not "fix" this by recolouring the
  mark to cyan or to a single colour without Adnan's call.
  Plain geometry, no SVG filter (GTK symbolic recolour drops filters, and
  a filter would break the trace anyway).
-->
<defs><linearGradient id="vblue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#027CFE"/><stop offset="0.45" stop-color="#0355F9"/><stop offset="1" stop-color="#0333BB"/></linearGradient></defs>
