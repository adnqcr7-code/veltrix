<title>VELTRIX</title>
<!--
  VELTRIX brand mark (Adnan's logo, 2026-11-14): a stylised V — dark navy
  left half, bright-blue right half (vertical gradient), white slit with a
  small circle at the centre — plus the lowercase "veltrix" wordmark in dark
  navy with a blue dot over the i. The logo keeps its own navy/blue colours;
  it is NOT recoloured to the OS cyan accent (#00E5FF).
  Traced from veltrix-logo.jpg (~/workspace/veltrix/logo/) with potrace.
  The two halves are separate paths, so the white slit and circle are the
  gaps between them, exactly as in the source.
-->
